<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of a colorful bounce house with a water slide on a sunny lawn">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe1fb"/>
      <stop offset="0.6" stop-color="#dcefff"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec850"/>
      <stop offset="1" stop-color="#5fae39"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#7cc3f0"/>
    </linearGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd34d"/>
      <stop offset="1" stop-color="#f0a92b"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.92">
    <g transform="translate(1080,150)">
      <ellipse cx="0" cy="0" rx="90" ry="48"/>
      <ellipse cx="80" cy="14" rx="70" ry="40"/>
      <ellipse cx="-78" cy="16" rx="60" ry="34"/>
    </g>
    <g transform="translate(700,90)" opacity="0.85">
      <ellipse cx="0" cy="0" rx="70" ry="36"/>
      <ellipse cx="62" cy="10" rx="52" ry="30"/>
      <ellipse cx="-60" cy="12" rx="46" ry="26"/>
    </g>
    <g transform="translate(1380,300)" opacity="0.8">
      <ellipse cx="0" cy="0" rx="64" ry="34"/>
      <ellipse cx="56" cy="10" rx="48" ry="28"/>
    </g>
  </g>

  <!-- ground -->
  <rect x="0" y="770" width="1600" height="230" fill="url(#grass)"/>
  <ellipse cx="800" cy="775" rx="1000" ry="40" fill="#8ad15c" opacity="0.5"/>

  <!-- ===================== bounce house (right side) ===================== -->
  <g transform="translate(770,250)">
    <!-- back castle body -->
    <rect x="300" y="120" width="430" height="420" rx="26" fill="#3a93d6"/>
    <!-- color blocks on body -->
    <rect x="300" y="120" width="430" height="110" rx="26" fill="#e4572e"/>
    <rect x="300" y="430" width="430" height="110" rx="26" fill="#f3c623"/>
    <rect x="430" y="230" width="180" height="200" fill="#2ecc71"/>
    <!-- doorway -->
    <path d="M470 540 v-150 a85 85 0 0 1 170 0 v150 z" fill="#1b3a5c" opacity="0.55"/>
    <!-- towers -->
    <g>
      <rect x="300" y="40" width="80" height="110" rx="12" fill="#e4572e"/>
      <rect x="650" y="40" width="80" height="110" rx="12" fill="#e4572e"/>
      <rect x="475" y="20" width="90" height="120" rx="12" fill="#f3c623"/>
      <!-- lego studs -->
      <circle cx="340" cy="34" r="20" fill="#c8431f"/>
      <circle cx="690" cy="34" r="20" fill="#c8431f"/>
      <circle cx="520" cy="14" r="22" fill="#dcae16"/>
    </g>

    <!-- slide -->
    <path d="M300 360 C 170 380 120 470 90 560 L 250 560 C 270 470 300 430 360 420 Z" fill="url(#slide)"/>
    <path d="M300 360 C 220 372 175 420 150 480 L 235 480 C 258 440 285 405 350 398 Z" fill="#ff8c42" opacity="0.85"/>

    <!-- splash pool -->
    <rect x="-40" y="540" width="430" height="120" rx="60" fill="#2ecc71"/>
    <rect x="-20" y="556" width="390" height="92" rx="46" fill="url(#pool)"/>
    <!-- pool bumpers -->
    <g fill="#e4572e"><rect x="150" y="520" width="46" height="46" rx="12"/></g>
    <g fill="#3a93d6"><rect x="40" y="520" width="46" height="46" rx="12"/></g>
    <g fill="#f3c623"><rect x="260" y="520" width="46" height="46" rx="12"/></g>

    <!-- water splashes -->
    <g fill="#ffffff" opacity="0.9">
      <circle cx="120" cy="612" r="9"/>
      <circle cx="150" cy="600" r="6"/>
      <circle cx="95" cy="600" r="5"/>
      <circle cx="135" cy="585" r="4"/>
    </g>
  </g>

  <!-- foreground grass blades -->
  <g fill="#4f9e2e" opacity="0.6">
    <path d="M60 900 q10 -40 24 0 z"/>
    <path d="M110 920 q12 -46 26 0 z"/>
    <path d="M1500 910 q12 -44 26 0 z"/>
    <path d="M1440 930 q10 -38 22 0 z"/>
  </g>
</svg>
